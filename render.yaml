services:
  - type: web
    name: discord-live-dashboard
    runtime: node
    plan: starter          # 'free' sleeps after inactivity - live gateway would drop
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false        # set in the Render dashboard, never in git
      - key: DEMO_MODE
        value: "0"
      - key: PORT
        value: "3000"
      - key: NODE_VERSION
        value: "20"
